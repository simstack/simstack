name: Sync Docs to simstack-ui

on:
  push:
    branches: ["main", "master"]
    paths:
      - "doc/source/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sync-simstack-ui-docs
  cancel-in-progress: true

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout simstack
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build Sphinx docs
        run: uv run sphinx-build -b html doc/source doc/build/html

      - name: Validate simstack-ui token
        env:
          UI_PUSH_TOKEN: ${{ secrets.SIMSTACK_UI_PUSH_TOKEN }}
        run: |
          if [[ -z "${UI_PUSH_TOKEN}" ]]; then
            echo "Missing required secret: SIMSTACK_UI_PUSH_TOKEN"
            exit 1
          fi

      - name: Checkout simstack-ui
        uses: actions/checkout@v4
        with:
          repository: simstack/simstack-ui
          token: ${{ secrets.SIMSTACK_UI_PUSH_TOKEN }}
          path: simstack-ui
          fetch-depth: 0

      - name: Sync docs into simstack-ui
        run: |
          rsync -a --delete doc/build/html/ simstack-ui/public/docs/

      - name: Create or update docs PR in simstack-ui
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SIMSTACK_UI_PUSH_TOKEN }}
          path: simstack-ui
          base: main
          branch: bot/sync-docs-from-simstack
          delete-branch: true
          commit-message: "docs: sync from simstack ${{ github.sha }}"
          title: "docs: sync from simstack (${{ github.ref_name }})"
          body: |
            Automated docs sync from `simstack`.
            Source commit: `${{ github.sha }}`
          author: simstack-docs-bot <simstack-docs-bot@users.noreply.github.com>
          committer: simstack-docs-bot <simstack-docs-bot@users.noreply.github.com>
          add-paths: |
            public/docs
