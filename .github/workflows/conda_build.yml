name: "Build Conda Package"
on:
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  build_conda_package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install rattler-build
        run: |
          uv tool install rattler-build
      - name: Build
        id: build
        run: |
          rattler-build build --recipe simstack/conda-recipe/meta.yaml --output-dir build/
          # Find the built package. rattler-build output path can vary, but we can find it in build/
          OUTPUTFILE=$(find build/ -name "*.tar.bz2" -o -name "*.conda" | head -n 1)
          echo "releasepath=`realpath $OUTPUTFILE`" >> $GITHUB_OUTPUT

      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: condapackage
          path: ${{ steps.build.outputs.releasepath }}

      - name: Upload to Testing Repo
        id: upload
        run: |
          # rattler-build can also upload, or we can use another tool. 
          # Since pixi was used for upload, we can use rattler-build's upload capability or curl.
          # prefix.dev supports rattler-build upload.
          rattler-build upload prefix -c your_channel --token ${{ secrets.PREFIX_PUBLISH_KEY }} ${{ steps.build.outputs.releasepath }}
