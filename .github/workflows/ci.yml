name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:  # This line enables the manual run button

jobs:
  test-linux:
    name: Test on ubuntu-latest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    services:
      mongodb:
        image: mongodb/mongodb-community-server:latest
        ports:
          - 27017:27017
        env:
          MONGODB_INITDB_ROOT_USERNAME: root
          MONGODB_INITDB_ROOT_PASSWORD: rootpassword

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Set up Python ${{ matrix.python-version }}"
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Set up MongoDB for testing
        run: |
          uv run python -c "
          from pymongo import MongoClient
          client = MongoClient('mongodb://root:rootpassword@localhost:27017/')
          db = client['admin']
          db.command('createUser', 'testing', pwd='testpassword', roles=[{'role': 'readWrite', 'db': 'testing_data'}])
          db = client['testing_data']
          db['init'].insert_one({'init': True})
          print('MongoDB initialized with user testing and database testing_data')
          "
      - name: Run tests with runner
        shell: bash
        env:
          SIMSTACK_TEST_DB_CONNECTION_STRING: 'mongodb://testing:testpassword@localhost:27017/'
          SIMSTACK_TEST_DB: testing_data
          SIMSTACK_PROJECT_ROOT: ${{ github.workspace }}
        run: |
          mkdir -p simstack
          printf '[parameters]\n[parameters.general]\nuse_db = true\nworkdir_self = "${{ github.workspace }}/simstack"\n[parameters.db]\ndatabase = "testing_data"\nconnection_string = "mongodb://testing:testpassword@localhost:27017/"\n' > simstack.toml
          cat simstack.toml
          uv run create_model_table --dir tests
          uv run create_node_table --dir tests
          uv run python -m pytest tests --junitxml=pytest.xml --cov-report=term-missing --cov=simstack --cov-config=pyproject.toml

  package-html-docs:
    name: Build and Commit Package HTML Docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Set up Python 3.12"
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Generate API documentation sources
        run: uv run sphinx-apidoc -o doc/source/simstack/modules src/simstack -f

      - name: Build package HTML documentation with Sphinx
        run: |
          set -euo pipefail
          rm -rf src/simstack/static/docs
          mkdir -p src/simstack/static/docs
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          uv run sphinx-build -b html -d /tmp/simstack-docs-doctrees doc/source src/simstack/static/docs

      - name: Upload package HTML documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-docs
          path: src/simstack/static/docs

      - name: Commit generated package HTML docs
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git add -- src/simstack/static/docs
          git diff --cached --quiet && echo "Generated package documentation is already up to date." && exit 0
          # Official GitHub Actions bot noreply identity; keeps automated commits attributed to github-actions[bot].
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update generated package HTML [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  test-windows:
    name: Test on windows-latest (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install MongoDB
        run: |
          choco install mongodb --no-progress
          # The service might not start automatically or might need a moment
          Get-Service MongoDB -ErrorAction SilentlyContinue | Start-Service

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Set up Python ${{ matrix.python-version }}"
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Set up MongoDB for testing
        shell: pwsh
        run: |
          uv run python -c "
          from pymongo import MongoClient
          client = MongoClient('mongodb://localhost:27017/')
          db = client['admin']
          db = client['testing_data']
          db['init'].insert_one({'init': True})
          print('MongoDB initialized with database testing_data')
          "

      - name: Run tests with runner
        shell: pwsh
        env:
          SIMSTACK_TEST_DB_CONNECTION_STRING: 'mongodb://localhost:27017/'
          SIMSTACK_TEST_DB: testing_data
          SIMSTACK_PROJECT_ROOT: ${{ github.workspace }}
        run: |
          New-Item -ItemType Directory -Force -Path simstack
          $tomlContent = @"
          [parameters]
          [parameters.general]
          use_db = true
          workdir_self = "$($env:GITHUB_WORKSPACE -replace '\\', '\\')\\simstack"
          [parameters.db]
          database = "testing_data"
          connection_string = "mongodb://localhost:27017/"
          "@
          Set-Content -Path simstack.toml -Value $tomlContent
          Get-Content simstack.toml
          uv run create_model_table --dir tests
          uv run create_node_table --dir tests
          uv run python -m pytest tests --junitxml=pytest.xml --cov-report=term-missing --cov=simstack --cov-config=pyproject.toml
