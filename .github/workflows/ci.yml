name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Core unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install 3.12
      - run: uv sync --all-extras --dev --frozen
      - name: Run Core without a database
        run: uv run python -m pytest tests/without_context --junitxml=pytest-unit.xml -q

  domain-integration:
    name: Core through Server domain HTTP
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      SIMSTACK_SERVER_TEST_REF: ${{ vars.SIMSTACK_SERVER_TEST_REF }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: simstack
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: "simstack-server/uv.lock"
      - run: uv python install 3.12
      - name: Validate the reviewed Server revision
        run: uv run --no-project --python 3.12 python -c "import os,re; assert re.fullmatch('[0-9a-f]{40}', os.environ['SIMSTACK_SERVER_TEST_REF']), 'Set SIMSTACK_SERVER_TEST_REF to the reviewed compatible Server commit SHA'"
      - uses: actions/checkout@v6
        with:
          repository: simstack/simstack-server
          ref: ${{ env.SIMSTACK_SERVER_TEST_REF }}
          path: simstack-server
      - run: uv sync --project simstack-server --dev --frozen --no-install-package simstack
      - name: Install the checked-out Core in the Server environment
        run: uv pip install --no-config --python simstack-server/.venv --no-deps ./simstack
      - name: Use both checked-out source trees
        run: uv run --project simstack-server --no-sync python -c "import os,pathlib; p=pathlib.Path.cwd(); f=open(os.environ['GITHUB_ENV'],'a',encoding='utf-8'); print('PYTHONPATH='+os.pathsep.join([str(p/'simstack'/'src'),str(p/'simstack-server')]),file=f); f.close()"
      - name: Run HTTP integration scenarios
        run: uv run --project simstack-server --no-sync python -m pytest simstack/tests/with_context --junitxml=pytest-domain.xml -q
      - name: Run the actual HTTP-only Runner
        env:
          START_LOCAL_RUNNER: "true"
        run: uv run --project simstack-server --no-sync python -m pytest simstack/tests/with_context/with_runner/test_runner_completed.py --junitxml=pytest-runner.xml -q

  package-html-docs:
    name: Build Package HTML Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Set up Python 3.12"
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Generate API documentation sources
        run: uv run sphinx-apidoc -o doc/source/simstack/modules src/simstack -f

      - name: Build package HTML documentation with Sphinx
        run: |
          set -euo pipefail
          rm -rf src/simstack/static/docs
          mkdir -p src/simstack/static/docs
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          uv run sphinx-build -b html -d /tmp/simstack-docs-doctrees doc/source src/simstack/static/docs

      - name: Upload package HTML documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-docs
          path: src/simstack/static/docs
