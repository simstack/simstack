name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    name: Test on ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set SIMSTACK_PROJECT_ROOT
        run: echo "SIMSTACK_PROJECT_ROOT=${{ github.workspace }}" >> $GITHUB_ENV

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Set up Python ${{ matrix.python-version }}"
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install mongodb
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO - https://www.mongodb.org/static/pgp/server-6.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-6.0.gpg
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-6.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/6.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-6.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-mongosh

      - name: Create database and user
        run: |
          # Wait for MongoDB to be ready
          for i in {1..30}; do
            if mongosh --host localhost --port 27017 --eval 'db.adminCommand("ping")' > /dev/null 2>&1; then
              echo "MongoDB is ready"
              break
            fi
            echo "Waiting for MongoDB..."
            sleep 1
          done
          mongosh --host localhost --port 27017 --eval '
            db = db.getSiblingDB("git_testing");
            db.createUser({
              user: "git_testing",
              pwd: "X1234GitTesting",
              roles: [{ role: "readWrite", db: "git_testing" }]
            });
          '

      - name: Create simstack.toml
        run: |
          mkdir -p ${{ github.workspace }}/simstack_workdir
          cat <<EOF > ${{ github.workspace }}/simstack.toml
          [parameters]
          [parameters.general]
          use_db = true
          workdir_self = "${{ github.workspace }}/simstack_workdir"
          # these are parameters for one user for all hosts
          [parameters.db]
          connection_string="mongodb://git_testing:X1234GitTesting@localhost:27017/git_testing?authSource=git_testing"
          database = "git_testing"
          test_database = "git_testing"
          EOF

      - name: Initialize resources
        run: |
          export PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/src
          uv run python scripts/initialize_resources.py ${{ github.workspace }}/simstack.toml

      - name: initialize tables
        run: |
          uv run create_model_table -v --dir ${{ github.workspace }}/tests # --dir ${{ github.workspace }}/src/simstack/models --dir ${{ github.workspace }}/src/simstack/core --dir ${{ github.workspace }}/tests
          uv run create_node_table -v --dir ${{ github.workspace }}/tests # --dir ${{ github.workspace }}/src/simstack/methods --dir ${{ github.workspace }}/tests

      - name: Run tests (some)
        env:
          SIMSTACK_TEST_USE_REAL_DB: "true"
        run: |
          uv run python -m pytest tests/with_context/ --junitxml=pytest.xml --cov-report=term-missing --cov=simstack --cov-config=pyproject.toml
          # Verify simstack_runner can be invoked
          #uv run simstack_runner --help
          # Start a real simstack_runner in background for testing if needed
          #uv run simstack_runner --resource local --no-pull &
          #sleep 5
          # Basic check if it's running
          #pgrep -f simstack_runner

