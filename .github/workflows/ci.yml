name: CI

on:
  push:
    branches: [ "main", "master", "feature-new-datasets" ]
  pull_request:
    branches: [ "main", "master", "feature-new-datasets" ]
  workflow_dispatch:  # This line enables the manual run button

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    services:
      mongodb:
        image: mongodb/mongodb-community-server:latest
        ports:
          - 27017:27017
        env:
          MONGODB_INITDB_ROOT_USERNAME: root
          MONGODB_INITDB_ROOT_PASSWORD: rootpassword

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Set up Python ${{ matrix.python-version }}"
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Set up MongoDB for testing
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv run python -c "
          from pymongo import MongoClient
          client = MongoClient('mongodb://root:rootpassword@localhost:27017/')
          db = client['admin']
          db.command('createUser', 'testing', pwd='testpassword', roles=[{'role': 'readWrite', 'db': 'testing_data'}])
          db = client['testing_data']
          db['init'].insert_one({'init': True})
          print('MongoDB initialized with user testing and database testing_data')
          "

      - name: Run tests without context
        # Runs pytest with coverage, skipping 'local_runner' tests as per previous configuration
        run: uv run python -m pytest tests/without_context --junitxml=pytest.xml --cov-report=term-missing --cov=simstack --cov-config=pyproject.toml -m "not local_runner"

      - name: Run tests with context
        env:
          SIMSTACK_TEST_USE_REAL_DB: ${{ matrix.os == 'ubuntu-latest' && 'true' || 'false' }}
          MONGODB_CONNECTION_STRING: mongodb://testing:testpassword@localhost:27017/
          MONGODB_DATABASE: testing_data
        run: uv run python -m pytest tests/with_context --junitxml=pytest.xml --cov-report=term-missing --cov=simstack --cov-config=pyproject.toml -m "not local_runner"
      - name: Run tests with runner
        if: always()  # Add this line
        shell: bash
        env:
          SIMSTACK_TEST_USE_REAL_DB: ${{ matrix.os == 'ubuntu-latest' && 'true' || 'false' }}
          MONGODB_CONNECTION_STRING: mongodb://testing:testpassword@localhost:27017/
          MONGODB_DATABASE: testing_data
          SIMSTACK_PROJECT_ROOT: ${{ github.workspace }}
        run: |
          mkdir -p simstack
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            printf '[parameters]\n[parameters.general]\nuse_db = true\nworkdir_self = "${{ github.workspace }}/simstack"\n[parameters.db]\ndatabase = "testing_data"\nconnection_string = "mongodb://testing:testpassword@localhost:27017/"\n' > simstack.toml
          else
            printf '[parameters]\n[parameters.general]\nuse_db = true\nworkdir_self = "${{ github.workspace }}\\simstack"\n[parameters.db]\ndatabase = "testing_data"\nconnection_string = ""\n[parameters.general]\nuse_db = false\n' > simstack.toml
          fi
          cat simstack.toml
          uv run create_model_table --dir tests 
          uv run create_node_table --dir tests
          uv run python -m pytest tests/with_context/with_runner --junitxml=pytest.xml 
